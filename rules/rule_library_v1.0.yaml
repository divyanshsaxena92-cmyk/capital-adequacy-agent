    conservative_treatment: RISK_WEIGHT
    alternatives:
      - {risk_weight: 1.25, basis: "Para 18(1)(3)(e)(i)-(ii): unsecured retail consumer credit and credit card receivables."}
      - {risk_weight: 1.00, basis: "Para 18(1)(3)(e): housing, vehicle, education, gold and MFI loans and other secured loans are carved out of the 125% bucket."}
    citations: [P18-1, P18-2, P16-6]
    interpretive: true
    default_confidence: 0.72
    evidence_required: Product-wise loan book (retail unsecured / card / secured / staff) with stage-wise ECL
