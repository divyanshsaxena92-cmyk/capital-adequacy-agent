# Controlled rule library - NBFC capital adequacy
# Every rule must cite KB passage IDs. Rules with status != APPROVED are ignored by the engine.
# interpretive: true  => the regulation is silent/ambiguous for this item; agent may propose, never auto-apply.
# Treatments: T1_INCLUDE | T1_EXCLUDE | T1_DEDUCT | T2_GENERAL_PROVISION | RISK_WEIGHT | INFO
library_version: "RL-1.0"
framework: "NBFC-CA-2025"
approved_by: "PENDING - SME sign-off required before production use"
rules:
  # ---------------- Tier 1 inclusions ----------------
  - id: R-T1-001
    area: Tier 1
    title: Paid-up equity share capital
    match_terms: [equity share capital, paid-up, common equity, share capital]
    treatment: T1_INCLUDE
    citations: [P9, P7]
    interpretive: false
    default_confidence: 0.97
    evidence_required: Share capital note / ROC filings
    effective_from: "2025-11-28"
    status: APPROVED

  - id: R-T1-002
    area: Tier 1
    title: Securities premium on equity issues
    match_terms: [securities premium, share premium]
    treatment: T1_INCLUDE
    citations: [P9, P7]
    interpretive: false
    default_confidence: 0.96
    evidence_required: Other equity note
    effective_from: "2025-11-28"
    status: APPROVED

  - id: R-T1-003
    area: Tier 1
    title: Retained earnings / profit for the year
    match_terms: [retained earnings, surplus, profit and loss, accumulated profit]
    treatment: T1_INCLUDE
    citations: [P7, P9-iii]
    interpretive: false
    default_confidence: 0.88
    evidence_required: Confirm year-end figures audited; dividend appropriation after reporting date
    effective_from: "2025-11-28"
    status: APPROVED

  - id: R-T1-004
    area: Tier 1
    title: Statutory reserve u/s 45-IC of the RBI Act
    match_terms: [statutory reserve, 45-ic, reserve fund]
    treatment: T1_INCLUDE
    conservative_treatment: T1_EXCLUDE
    alternatives:
      - {treatment: T1_INCLUDE, basis: "Para 7(iv) names statutory reserves as a CET1 element (NBFC-UL); widely read as a free reserve for owned fund."}
      - {treatment: T1_EXCLUDE, basis: "Para 9 (owned fund, NBFC-ML) admits only 'free reserves'; a 45-IC reserve is earmarked and its use is restricted by statute."}
    citations: [P7, P9, P10]
    interpretive: true
    default_confidence: 0.60
    evidence_required: NBFC layer classification (ML vs UL); firm methodology precedent; prior RBI returns treatment
    effective_from: "2025-11-28"
    status: APPROVED

  - id: R-T1-005
    area: Tier 1
    title: Other disclosed free reserves / equity contributions
    match_terms: [capital contribution, corporate guarantee, esop, share based payment, equity others, free reserves]
    treatment: T1_EXCLUDE
    conservative_treatment: T1_EXCLUDE
    alternatives:
      - {treatment: T1_EXCLUDE, basis: "Notional Ind AS credits (parent guarantee fair value, unvested ESOP charge) are not paid-in capital and are not reserves created out of profits."}
      - {treatment: T1_INCLUDE, basis: "Para 7(vi) admits 'other disclosed free reserves'; vested/unencumbered contributions may qualify."}
    citations: [P7, P9]
    interpretive: true
    default_confidence: 0.62
    evidence_required: Nature of contribution (guarantee terms, ESOP vesting, whether refundable / encumbered)
    effective_from: "2025-11-28"
    status: APPROVED

  # ---------------- Tier 1 Ind AS adjustments ----------------
  - id: R-T1-006
    area: Tier 1
    title: Cash flow hedge reserve - derecognise
    match_terms: [cash flow hedge reserve, cfhr, hedge reserve]
    treatment: T1_EXCLUDE
    citations: [P16-3]
    interpretive: false
    default_confidence: 0.96
    evidence_required: OCI reserve note
    effective_from: "2025-11-28"
    status: APPROVED

  - id: R-T1-007
    area: Tier 1
    title: Cost of hedging reserve
    match_terms: [cost of hedging]
    treatment: T1_INCLUDE
    conservative_treatment: T1_INCLUDE
    alternatives:
      - {treatment: T1_INCLUDE, basis: "Para 16(1): net unrealised losses are recognised in capital; this is a debit balance."}
      - {treatment: T1_EXCLUDE, basis: "Para 16(3): the reserve arises from the same cash-flow hedge relationship as the CFHR and could be derecognised with it."}
    citations: [P16-1, P16-3, P16-4]
    interpretive: true
    default_confidence: 0.58
    evidence_required: Hedge documentation linking cost-of-hedging reserve to designated CFH relationships
    effective_from: "2025-11-28"
    status: APPROVED

  - id: R-T1-008
    area: Tier 1
    title: Remeasurement of defined benefit plans (OCI)
    match_terms: [remeasurement, defined benefit, actuarial]
    treatment: T1_EXCLUDE
    conservative_treatment: T1_EXCLUDE
    alternatives:
      - {treatment: T1_EXCLUDE, basis: "Conservative: credit balance not demonstrated to be a free reserve."}
      - {treatment: T1_INCLUDE, basis: "Para 8(6) requires DB liabilities to be fully recognised; actuarial gains form part of reserves."}
    citations: [P8-6, P16-1]
    interpretive: true
    default_confidence: 0.55
    evidence_required: Actuarial report; whether a net DB asset exists (deductible)
    effective_from: "2025-11-28"
    status: APPROVED

  # ---------------- Tier 1 deductions ----------------
  - id: R-T1-009
    area: Tier 1
    title: Deferred tax assets (net of DTL)
    match_terms: [deferred tax asset, dta]
    treatment: T1_DEDUCT
    citations: [P14, P8-2]
    interpretive: false
    default_confidence: 0.95
    evidence_required: Tax note confirming DTA/DTL composition and same-authority netting
    effective_from: "2025-11-28"
    status: APPROVED

  - id: R-T1-010
    area: Tier 1
    title: Prepaid expenses / deferred revenue expenditure
    match_terms: [prepaid, deferred revenue expenditure]
    treatment: T1_DEDUCT
    conservative_treatment: T1_DEDUCT
    alternatives:
      - {treatment: T1_DEDUCT, basis: "Para 9(viii): owned fund is reduced by deferred revenue expenditure; prepaids treated as analogous (conservative)."}
      - {treatment: T1_INCLUDE, basis: "Prepaid expenses are not intangibles or DRE under Ind AS; carry 100% risk weight instead."}
    citations: [P9, P18-2]
    interpretive: true
    default_confidence: 0.70
    evidence_required: Nature of prepaid balance
    effective_from: "2025-11-28"
    status: APPROVED

  - id: R-T1-011
    area: Tier 1
    title: Right-of-use asset - not deducted if underlying is tangible
    match_terms: [right-of-use, right of use, rou]
    treatment: T1_EXCLUDE
